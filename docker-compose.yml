services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - ai_hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AI Hub
      APP_VERSION: 1.0.0
      AI_HUB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/ai_hub
      AI_HUB_SECRET_KEY: ${AI_HUB_SECRET_KEY:-replace_with_a_long_random_secret}
      UPLOAD_DIR: /app/uploads
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  ai_hub_postgres:
